name: Verify Cloudflare Worker image generation

on:
  push:
    branches:
      - main
    paths:
      - worker/**
      - .github/workflows/verify-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Worker health
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 \
            https://ala-design-image-api.ai-creative-platform.workers.dev/health

      - name: Generate and validate one real image
        env:
          WORKER_URL: https://ala-design-image-api.ai-creative-platform.workers.dev/api/generate-image
        run: |
          response_file="${RUNNER_TEMP}/worker-response.json"
          status_code="$(curl --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -H 'Origin: https://1974898705-ui.github.io' \
            -H 'Content-Type: application/json' \
            -H 'X-ALA-Client: ala-design-web' \
            --data '{"mode":"full-artwork","prompt":"Generate a complete portrait financial marketing popup: festive ornament, scalloped card, title, one 60% off offer and a separate blue CTA. Flat vector style, no gradients."}' \
            "$WORKER_URL" \
            --output "$response_file" \
            --write-out '%{http_code}')"
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const status=Number(process.argv[2]);if(status>=400||!p.image?.startsWith('data:image/jpeg;base64,')||p.image.length<1000||p.mode!=='full-artwork'||p.width!==704||p.height!==1024){console.error(JSON.stringify({status,error:p.error,code:p.code,mode:p.mode,width:p.width,height:p.height}));process.exit(1)}console.log(JSON.stringify({ok:true,provider:p.provider,model:p.model,mode:p.mode,width:p.width,height:p.height,imageCharacters:p.image.length}))" "$response_file" "$status_code"
