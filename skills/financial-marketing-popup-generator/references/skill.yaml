---
schema_version: '1.0'
package:
  id: financial-marketing-popup-generator
  name: 首页弹窗设计规则
  version: 1.3.0
  language: zh-CN
  type: platform_agnostic_rule_package
  purpose: Generate themed financial marketing popups on a locked information layout,
    while allowing controlled variation in theme graphics, edge cuts, and color combinations.
entrypoints:
  primary: skill.yaml
  documentation: "../SKILL.md"
modules:
- id: layout
  path: rules/layout.yaml
  required: true
- id: edge_language
  path: rules/edge-language.yaml
  required: true
- id: top_visual
  path: rules/top-visual.yaml
  required: true
- id: graphic_style
  path: rules/graphic-style.yaml
  required: true
- id: colors
  path: rules/colors.yaml
  required: true
- id: cta
  path: rules/cta.yaml
  required: true
- id: typography
  path: rules/typography.yaml
  required: true
- id: validation
  path: rules/validation.yaml
  required: true
- id: theme_examples
  path: examples/themes.yaml
  required: false
precedence:
  order_high_to_low:
  - rules/validation.yaml
  - rules/layout.yaml
  - rules/cta.yaml
  - rules/typography.yaml
  - rules/top-visual.yaml
  - rules/colors.yaml
  - rules/edge-language.yaml
  - rules/graphic-style.yaml
  - examples/themes.yaml
  conflict_rule: A lower-priority file may not override a locked value or a hard rejection
    condition from a higher-priority file. Theme configurations are examples and may
    only fill fields explicitly marked variable.
core_principle:
  statement: Clear offer-first typography on broad color regions, coordinated border
    rhythm and a rich compact thematic top illustration.
  hierarchy:
    offer: 100
    title: 70
    cta: 55
    top_visual: 28
    edge_treatment: 18
    micro_decoration: 10
  hierarchy_formula: OFFER > TITLE > CTA > TOP_VISUAL > EDGE_TREATMENT > MICRO_DECORATION
  tone_balance:
    financial_stability: 0.65
    playful_theme: 0.35
inputs:
  required:
  - theme.id
  - copy.title
  - copy.benefit_description
  - copy.offer.primary_value
  - copy.offer.percentage
  - copy.offer.suffix
  - copy.cta
  optional:
  - theme.primary_symbol
  - theme.supporting_symbols
  - theme.micro_symbols
  - theme.palette_selection
  - edge_profile
outputs:
  composite_preview:
    required: true
    canvas: 279x400 transparent
  card_group:
    required: true
    includes:
    - top_visual
    - card
    - title
    - offer_panel
    excludes:
    - cta
  cta_asset:
    required: true
    independent_from_card: true
    transparent_background: true
    tight_crop: 237x44
  font_files:
    included: false
allowed_variation:
- theme symbols within the top-visual limits
- outer-card edge profile
- offer-panel edge profile
- dominant/secondary/accent selection from the approved palette
- zero to four micro decorations in approved zones
- upper/lower color split and restrained separator pattern
- simple ordered edge silhouettes with optional internal marks
- flat-vector top composition enriched by layered color shapes, internal patterns,
  supporting objects and occlusion
locked_invariants:
- canvas size and transparency
- card, inset title/offer text safe zones, and CTA coordinates and dimensions; visible
  panels are optional
- top visual width at exactly 50% of card width and never wider
- top visual behind the card and horizontally centered
- CTA color, shape, position, independent export, and empty surroundings
- Roboto family and role-based font weights
- offer-first information hierarchy
- continuous naturally turning border corners; left/right 7-9 repeated motifs each,
  bottom 5-7; corner transitions excluded
color_structure:
  default: upper/lower color partition on one shared silhouette
  mandatory_three_blocks: false
  visible_text_containers_required: false
text_inset_update:
  inset_each_edge_px: 5
  title_text:
    x: 45
    y: 87
    width: 189
    height: 45
  offer_text:
    x: 45
    y: 163
    width: 189
    height: 105
